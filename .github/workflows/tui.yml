name: TUI

# A TUI-only change is gated by this workflow alone: tui/bin/test runs the
# shared bin/check-conventions (which carries the TUI checks), so test.yml
# ignores tui/** and does not rebuild the Qt app for the Go port. Path filters
# are evaluated over the whole pull-request diff, so a pull request that also
# changes bin/check-conventions or bin/test still triggers both workflows.
#
# Version tags and workflow_dispatch also cross-compile static archives and
# upload them onto the GitHub Release that release-package.yml creates.
# Pull requests and master merges do not upload archives.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tui/**'
      - 'bin/version'
      - 'bin/check-conventions'
      - 'bin/bump-homebrew-tui'
      - 'bin/bump-scoop-tui'
      - 'version.pri'
      - 'packaging/tui/**'
      - 'Formula/omairc-tui.rb'
      - 'bucket/omairc-tui.json'
      - '.github/workflows/tui.yml'
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'tui/**'
      - 'bin/version'
      - 'bin/check-conventions'
      - 'bin/bump-homebrew-tui'
      - 'bin/bump-scoop-tui'
      - 'version.pri'
      - 'packaging/tui/**'
      - 'Formula/omairc-tui.rb'
      - 'bucket/omairc-tui.json'
      - '.github/workflows/tui.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require master or a phase branch as the pull request base
        run: |
          case "${{ github.base_ref }}" in
            master|tui-phase-*) ;;
            *) echo "This pull request targets ${{ github.base_ref }}, not master or a tui-phase branch." >&2; exit 1 ;;
          esac

  # No `needs: base`: `base` is skipped on push, and a skipped dependency skips
  # its dependents too, so the TUI job would never run on master. Keep the two
  # jobs independent, matching test.yml.
  tui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: tui/go.sum

      - name: Run tui/bin/test
        run: tui/bin/test

  # Dry-build packaging/tui/PKGBUILD in an Arch container so a PKGBUILD
  # regression fails the pull request instead of release-package.yml's tag
  # job, which both builds this package and creates the GitHub Release. Tags
  # skip it; release-package.yml builds the same package there.
  dry-build:
    name: Arch package
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Bootstrap pacman
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo

      - uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Install Go
        run: |
          set -euo pipefail
          pacman -S --noconfirm go
          raw=$(go version | awk '{print $3}')
          ver=${raw#go}
          major=${ver%%.*}
          rest=${ver#*.}
          minor=${rest%%.*}
          if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 25 ]; }; then
            echo "go $ver is older than 1.25" >&2
            exit 1
          fi
          echo "Using go $ver"

      - name: Prepare dry-build packaging/tui/PKGBUILD source
        run: |
          set -euo pipefail
          pkgver=$(./bin/version)
          tag_source="omairc-${pkgver}.tar.gz::https://github.com/fredimachado/omairc/archive/refs/tags/v${pkgver}.tar.gz"
          source0=$(bash -c 'source packaging/tui/PKGBUILD; printf %s "${source[0]}"')
          test "$source0" = "$tag_source" || {
            echo "packaging/tui/PKGBUILD must fetch the tag tarball $tag_source" >&2
            printf 'got: %s\n' "$source0" >&2
            exit 1
          }
          source_tar=$(mktemp "/tmp/omairc-${pkgver}.XXXXXX.tar.gz")
          tar --exclude='.git' --exclude='.arena-omairc-pacman' \
            -czf "$source_tar" \
            --transform "s,^\.,omairc-${pkgver}," .
          mv "$source_tar" "omairc-${pkgver}.tar.gz"
          ln -sfn "$GITHUB_WORKSPACE/omairc-${pkgver}.tar.gz" \
            "packaging/tui/omairc-${pkgver}.tar.gz"
          sed -i "s|^source=.*|source=(\"omairc-${pkgver}.tar.gz\")|" \
            packaging/tui/PKGBUILD
          chown -R builder:builder packaging/tui
          chown builder:builder "omairc-${pkgver}.tar.gz"

      - name: makepkg packaging/tui/PKGBUILD
        run: |
          set -euo pipefail
          chown -R builder:builder packaging/tui
          cd packaging/tui
          sudo -u builder makepkg -s --noconfirm

      - name: Verify the omairc-tui package
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(packaging/tui/omairc-tui-*-x86_64.pkg.tar.zst)
          test "${#pkgs[@]}" -eq 1
          version=$(./bin/version)
          meta=$(pacman -Qp "${pkgs[0]}")
          test "$meta" = "omairc-tui ${version}-1"
          tmp=$(mktemp -d)
          tar -xf "${pkgs[0]}" -C "$tmp" usr/bin/omairc-tui
          got=$("$tmp/usr/bin/omairc-tui" --version)
          rm -rf "$tmp"
          test "$got" = "omairc-tui $version"

  package:
    needs: tui
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: tui/go.sum

      - name: Package static archives
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )
          for target in "${targets[@]}"; do
            read -r os arch <<<"$target"
            GOOS="$os" GOARCH="$arch" tui/bin/package
          done
          shopt -s nullglob
          archives=(tui/dist/omairc-tui-*)
          if [ "${#archives[@]}" -ne 5 ]; then
            echo "Expected 5 omairc-tui archives, found ${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi

      - name: Upload static archives
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: omairc-tui-${{ github.ref_name }}
          path: tui/dist/omairc-tui-*
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          built=(tui/dist/omairc-tui-*)
          if [ "${#built[@]}" -ne 5 ]; then
            echo "Expected 5 omairc-tui archives to upload" >&2
            exit 1
          fi

          deadline=$(( $(date +%s) + 1800 ))
          while ! gh release view "$tag" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting for GitHub Release $tag (created by Release package)" >&2
              exit 1
            fi
            echo "Waiting for release $tag..."
            sleep 15
          done

          # Replace only stale terminal archives. Leave omairc-tui *.pkg.tar.zst
          # to the Arch publisher, and never touch omairc-<ver> Qt assets.
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          while IFS= read -r asset || [ -n "$asset" ]; do
            [ -n "$asset" ] || continue
            case "$asset" in
              omairc-tui-*.tar.gz|omairc-tui-*-windows-amd64.zip) ;;
              *) continue ;;
            esac
            keep=0
            for file in "${built[@]}"; do
              if [ "$(basename "$file")" = "$asset" ]; then
                keep=1
                break
              fi
            done
            if [ "$keep" -eq 0 ]; then
              gh release delete-asset "$tag" "$asset" --yes
            fi
          done <<< "$assets"

          gh release upload "$tag" "${built[@]}" --clobber

  bump-manifests:
    name: Formula and Scoop
    needs: package
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download static archives
        uses: actions/download-artifact@v4
        with:
          name: omairc-tui-${{ github.ref_name }}
          path: tui/dist

      - name: Point the formula and Scoop manifest at this tag
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          arm=(tui/dist/omairc-tui-*-darwin-arm64.tar.gz)
          intel=(tui/dist/omairc-tui-*-darwin-amd64.tar.gz)
          win=(tui/dist/omairc-tui-*-windows-amd64.zip)
          if [ "${#arm[@]}" -ne 1 ] || [ ! -f "${arm[0]}" ]; then
            echo "Expected one darwin-arm64 tarball" >&2
            exit 1
          fi
          if [ "${#intel[@]}" -ne 1 ] || [ ! -f "${intel[0]}" ]; then
            echo "Expected one darwin-amd64 tarball" >&2
            exit 1
          fi
          if [ "${#win[@]}" -ne 1 ] || [ ! -f "${win[0]}" ]; then
            echo "Expected one windows-amd64 zip" >&2
            exit 1
          fi

          commit_tui_bump() {
            python3 bin/bump-homebrew-tui \
              --version "$tag" \
              --arm-archive "${arm[0]}" \
              --intel-archive "${intel[0]}"
            python3 bin/bump-scoop-tui \
              --version "$tag" \
              --zip "${win[0]}"
            git add Formula/omairc-tui.rb bucket/omairc-tui.json
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m "Point the omairc-tui formula and Scoop manifest at v${tag}."
            return 0
          }

          if ! commit_tui_bump; then
            echo "Formula and Scoop manifest already match $tag"
            exit 0
          fi

          attempt=1
          max_attempts=5
          while [ "$attempt" -le "$max_attempts" ]; do
            if push_out=$(git push origin HEAD:master 2>&1); then
              printf '%s\n' "$push_out"
              echo "Pushed omairc-tui manifest bump for v$tag"
              exit 0
            fi
            printf '%s\n' "$push_out"
            case "$push_out" in
              *non-fast-forward*|*rejected*) ;;
              *)
                echo "git push failed for a reason other than a master race" >&2
                exit 1
                ;;
            esac
            echo "Push was not a fast-forward; fetch and rebase (attempt $attempt/$max_attempts)"
            git fetch origin master
            if git rebase origin/master; then
              attempt=$((attempt + 1))
              continue
            fi
            echo "Rebase conflict; re-apply the generated bump on origin/master"
            git rebase --abort
            git reset --hard origin/master
            if ! commit_tui_bump; then
              echo "Formula and Scoop manifest already match $tag on origin/master"
              exit 0
            fi
            attempt=$((attempt + 1))
          done

          echo "Could not push the omairc-tui manifest bump after $max_attempts attempts" >&2
          exit 1
