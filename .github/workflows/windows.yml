name: Windows build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - 'bin/build.bat'
      - 'bin/derive-build-versions.py'
      - 'bin/gen-omaircversion-h.py'
      - 'bin/package-windows.bat'
      - 'packaging/windows/**'
      - 'omairc.pro'
      - 'qtkeychain.pri'
      - 'version.pri'
      - 'src/**'
      - 'fonts/**'
      - 'data/icons/**'
      - 'LICENSE'
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - '.github/workflows/windows.yml'
      - 'bin/build.bat'
      - 'bin/derive-build-versions.py'
      - 'bin/gen-omaircversion-h.py'
      - 'bin/package-windows.bat'
      - 'packaging/windows/**'
      - 'omairc.pro'
      - 'qtkeychain.pri'
      - 'version.pri'
      - 'src/**'
      - 'fonts/**'
      - 'data/icons/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_VERSION: 6.8.3
      QTKEYCHAIN_VERSION: 0.15.0
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Derive versions
        run: |
          python bin/derive-build-versions.py `
            --git-ref "$env:GITHUB_REF" `
            --sha "$env:GITHUB_SHA" `
            --run-number "$env:GITHUB_RUN_NUMBER" `
            --run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --format github-env `
            --github-env "$env:GITHUB_ENV"
          Add-Content $env:GITHUB_ENV "OMAIRC_BUILD_NUMBER=$env:GITHUB_RUN_NUMBER"
          Get-Content $env:GITHUB_ENV | Select-String '^OMAIRC_'

      - name: Assert tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) { throw "Expected v* tag, got $tag" }
          $expected = $tag.Substring(1)
          if ($expected -ne $env:OMAIRC_VERSION) {
            throw "Tag $tag does not match version.pri $($env:OMAIRC_VERSION)"
          }
          if ($env:OMAIRC_DISPLAY_VERSION -ne $env:OMAIRC_VERSION) {
            throw "Tag builds must keep unsuffixed display version"
          }
          if ($env:OMAIRC_ARTIFACT_VERSION -ne $env:OMAIRC_VERSION) {
            throw "Tag builds must keep unsuffixed artifact version"
          }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ env.QT_VERSION }}-win64_msvc2022_64-qtkeychain-${{ env.QTKEYCHAIN_VERSION }}

      - name: Install Qt 6
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "$env:RUNNER_TEMP\aqt"
          & "$env:RUNNER_TEMP\aqt\Scripts\pip" install aqtinstall
          & "$env:RUNNER_TEMP\aqt\Scripts\aqt" install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 `
            -O "$env:RUNNER_TEMP\Qt"

      - name: Add Qt to PATH
        run: |
          $qtBin = Join-Path $env:RUNNER_TEMP "Qt\$env:QT_VERSION\msvc2022_64\bin"
          if (-not (Test-Path (Join-Path $qtBin 'qmake.exe'))) {
            throw "qmake not found at $qtBin"
          }
          Add-Content $env:GITHUB_PATH $qtBin
          Add-Content $env:GITHUB_ENV "QMAKE=$qtBin\qmake.exe"

      - name: Install QtKeychain
        run: |
          $qmake = $env:QMAKE
          $qtPrefix = & $qmake -query QT_INSTALL_PREFIX
          $pri = Join-Path (& $qmake -query QT_INSTALL_ARCHDATA) 'mkspecs\modules\qt_Qt6Keychain.pri'
          if (Test-Path $pri) {
            Write-Host "QtKeychain already at $pri"
            exit 0
          }
          $src = Join-Path $env:RUNNER_TEMP 'qtkeychain-src'
          $build = Join-Path $env:RUNNER_TEMP 'qtkeychain-build'
          git clone --depth 1 --branch $env:QTKEYCHAIN_VERSION `
            https://github.com/frankosterfeld/qtkeychain.git $src
          cmake -S $src -B $build -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtPrefix" `
            -DCMAKE_INSTALL_PREFIX="$qtPrefix" `
            -DBUILD_WITH_QT6=ON `
            -DBUILD_TRANSLATIONS=OFF `
            -DBUILD_TEST_APPLICATION=OFF `
            -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $pri)) {
            throw "QtKeychain installed but $pri is missing."
          }

      - name: Build
        shell: cmd
        run: bin\build.bat

      - name: Smoke
        run: |
          $exe = 'build\release\omairc.exe'
          if (-not (Test-Path $exe)) { throw "Expected $exe" }
          $keychain = Get-ChildItem 'build\release' -Filter '*qt6keychain.dll' -File
          if (-not $keychain) { throw 'qt6keychain.dll was not deployed next to the exe' }
          if (-not (Test-Path 'build\release\msvcp140.dll')) {
            throw 'msvcp140.dll was not deployed next to the exe'
          }
          $version = (& $exe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = "omairc $($env:OMAIRC_DISPLAY_VERSION)"
          if ($version -ne $expected) { throw "Expected '$expected', got: $version" }
          $help = & $exe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($help -notmatch 'Usage:') { throw "Expected help text, got: $help" }

          $env:OMAIRC_ALLOW_MULTI = '1'
          $env:OMAIRC_SMOKE = '1'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $qtPlugins = Join-Path $env:RUNNER_TEMP "Qt\$env:QT_VERSION\msvc2022_64\plugins"
          if (Test-Path $qtPlugins) { $env:QT_PLUGIN_PATH = $qtPlugins }
          $full = (Resolve-Path $exe).Path
          $p = Start-Process -FilePath $full -ArgumentList '--demo-server' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(30000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'demo-server smoke did not exit within 30s'
          }
          if ($p.ExitCode -ne 0) { throw "demo-server smoke exited $($p.ExitCode)" }

          $junk = @('*.obj','*.pdb','*.res','*.ilk','moc_*.cpp','moc_predefs.h','qrc_*.cpp')
          Get-ChildItem 'build\release' -File | Where-Object {
            foreach ($pat in $junk) { if ($_.Name -like $pat) { return $true } }
            $false
          } | Remove-Item -Force
          $files = Get-ChildItem 'build\release' -Recurse -File
          $mb = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 2)
          Write-Host "Portable tree: $($files.Count) files, $mb MB"

      - name: Upload portable tree
        uses: actions/upload-artifact@v4
        with:
          name: omairc-${{ env.OMAIRC_ARTIFACT_VERSION }}-windows-x64
          path: |
            build/release/**
            !build/release/*.obj
            !build/release/*.pdb
            !build/release/*.res
            !build/release/*.ilk
            !build/release/moc_*
            !build/release/qrc_*
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package installer
        shell: cmd
        run: bin\package-windows.bat

      - name: Smoke installer
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "dist\omairc-$($env:OMAIRC_ARTIFACT_VERSION)-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Expected $setup" }

          $envKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $pathBefore = $null
          if ($null -ne $envKey -and $null -ne $envKey.GetValue('Path')) {
            $pathBefore = $envKey.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          }

          $dest = Join-Path $env:RUNNER_TEMP 'omairc-inst'
          $log = Join-Path $env:RUNNER_TEMP 'omairc-setup.log'
          $setupArgs = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/CURRENTUSER',
            "/DIR=$dest",
            "/LOG=$log"
          )
          $p = Start-Process -FilePath (Resolve-Path $setup).Path -ArgumentList $setupArgs -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "Installer exited $($p.ExitCode)"
          }
          $exe = Join-Path $dest 'omairc.exe'
          if (-not (Test-Path $exe)) { throw "Expected $exe after install" }
          if (-not (Test-Path (Join-Path $dest 'LICENSE.txt'))) {
            throw 'LICENSE.txt was not installed'
          }
          if (-not (Test-Path (Join-Path $dest 'msvcp140.dll'))) {
            throw 'msvcp140.dll was not installed'
          }
          $version = (& $exe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = "omairc $($env:OMAIRC_DISPLAY_VERSION)"
          if ($version -ne $expected) { throw "Expected '$expected', got: $version" }
          $mb = [math]::Round(((Get-Item $setup).Length) / 1MB, 2)
          Write-Host "Installer: $setup ($mb MB)"

          $unins = Join-Path $dest 'unins000.exe'
          if (-not (Test-Path $unins)) { throw "Expected $unins" }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Omairc.lnk'
          $uninsLog = Join-Path $env:RUNNER_TEMP 'omairc-unins.log'
          $uninsArgs = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/LOG=$uninsLog"
          )
          Start-Process -FilePath $unins -ArgumentList $uninsArgs | Out-Null
          $deadline = (Get-Date).AddMinutes(2)
          while (Test-Path $dest) {
            if ((Get-Date) -gt $deadline) {
              if (Test-Path $uninsLog) { Get-Content $uninsLog }
              if (Test-Path $log) { Get-Content $log }
              throw "Uninstall did not remove $dest"
            }
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $exe) { throw 'omairc.exe still present after uninstall' }
          if (Test-Path $shortcut) { throw 'Start Menu shortcut still present after uninstall' }

          $pathDeadline = (Get-Date).AddSeconds(15)
          do {
            $envKeyAfter = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
            $pathAfter = $null
            if ($null -ne $envKeyAfter -and $null -ne $envKeyAfter.GetValue('Path')) {
              $pathAfter = $envKeyAfter.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            }
            if ($pathBefore -ceq $pathAfter) { break }
            if ((Get-Date) -gt $pathDeadline) {
              if (Test-Path $uninsLog) { Get-Content $uninsLog }
              throw "Path mutated by install/uninstall. before=[$pathBefore] after=[$pathAfter]"
            }
            Start-Sleep -Milliseconds 200
          } while ($true)
          Write-Host 'Uninstall removed the install dir and Start Menu shortcut; Path is unchanged'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: omairc-${{ env.OMAIRC_ARTIFACT_VERSION }}-windows-x64-setup
          path: dist/omairc-${{ env.OMAIRC_ARTIFACT_VERSION }}-windows-x64-setup.exe
          if-no-files-found: error

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ver = $env:OMAIRC_VERSION
          $name = "omairc-$ver-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path 'build\release\*' -Destination $stage -Recurse
          $zip = Join-Path (Get-Location) "$name.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 2)
          Write-Host "Release zip: $zip ($mb MB)"

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $ver = $env:OMAIRC_VERSION
          $zipName = "omairc-$ver-windows-x64.zip"
          $setupName = "omairc-$ver-windows-x64-setup.exe"
          $setupPath = Join-Path 'dist' $setupName
          if (-not (Test-Path $zipName)) { throw "Missing $zipName" }
          if (-not (Test-Path $setupPath)) { throw "Missing $setupPath" }

          # Release package creates the GitHub Release; wait if this job finishes first.
          $deadline = (Get-Date).AddMinutes(30)
          while ($true) {
            gh release view $tag 1>$null 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            if ((Get-Date) -gt $deadline) {
              throw "Timed out waiting for GitHub Release $tag (created by Release package)"
            }
            Write-Host "Waiting for release $tag..."
            Start-Sleep -Seconds 15
          }

          $assetList = gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "gh release view $tag failed" }
          foreach ($asset in @($assetList)) {
            if (-not $asset) { continue }
            if ($asset -like 'omairc-*-windows-x64.zip' -and $asset -ne $zipName) {
              gh release delete-asset $tag $asset --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale asset $asset" }
            }
            if ($asset -like 'omairc-*-windows-x64-setup.exe' -and $asset -ne $setupName) {
              gh release delete-asset $tag $asset --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale asset $asset" }
            }
          }

          gh release upload $tag $zipName $setupPath --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Windows assets" }
