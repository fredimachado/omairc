name: Windows build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - 'bin/build.bat'
      - 'bin/build-rust.bat'
      - 'bin/derive-build-versions.py'
      - 'bin/gen-omaircversion-h.py'
      - 'bin/package-windows.bat'
      - 'packaging/windows/**'
      - 'omairc.pro'
      - 'qtkeychain.pri'
      - 'version.pri'
      - 'src/**'
      - 'poc/**'
      - 'fonts/**'
      - 'data/icons/**'
      - 'LICENSE'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/windows.yml'
      - 'bin/build.bat'
      - 'bin/build-rust.bat'
      - 'bin/derive-build-versions.py'
      - 'bin/gen-omaircversion-h.py'
      - 'bin/package-windows.bat'
      - 'packaging/windows/**'
      - 'omairc.pro'
      - 'qtkeychain.pri'
      - 'version.pri'
      - 'src/**'
      - 'poc/**'
      - 'fonts/**'
      - 'data/icons/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  # Split path filters so a poc-only change does not pay for the Qt toolchain.
  # Tags and workflow_dispatch run both jobs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      qt: ${{ steps.select.outputs.qt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        with:
          filters: |
            rust:
              - 'poc/**'
              - 'version.pri'
              - 'fonts/**'
              - 'bin/build-rust.bat'
              - 'bin/package-windows.bat'
              - 'packaging/windows/**'
              - '.github/workflows/windows.yml'
            qt:
              - '.github/workflows/windows.yml'
              - 'bin/build.bat'
              - 'bin/derive-build-versions.py'
              - 'bin/gen-omaircversion-h.py'
              - 'bin/package-windows.bat'
              - 'packaging/windows/**'
              - 'omairc.pro'
              - 'qtkeychain.pri'
              - 'version.pri'
              - 'src/**'
              - 'fonts/**'
              - 'data/icons/**'
              - 'LICENSE'
      - name: Select jobs
        id: select
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "qt=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rust=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
          echo "qt=${{ steps.filter.outputs.qt }}" >> "$GITHUB_OUTPUT"

  # Rust product client. No Qt. Stages build\release and packages the same
  # omairc-<v>-windows-x64-setup.exe name so Qt installs can upgrade later.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Derive versions
        run: |
          python bin/derive-build-versions.py `
            --git-ref "$env:GITHUB_REF" `
            --sha "$env:GITHUB_SHA" `
            --run-number "$env:GITHUB_RUN_NUMBER" `
            --run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --format github-env `
            --github-env "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Keep display/artifact for packaging names. Clear the cargo stamp so
          # Clippy/Test read version.pri (build.rs treats empty as unset).
          # bin\build-rust.bat gets OMAIRC_BUILD_VERSION only on the Build step.
          Add-Content $env:GITHUB_ENV "OMAIRC_BUILD_VERSION="
          Get-Content $env:GITHUB_ENV | Select-String '^OMAIRC_'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: poc
          key: windows-rust-${{ hashFiles('poc/Cargo.lock') }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Same product clippy as Linux test.yml so Windows-only unused_imports
      # cannot regress green. Style/complexity groups stay allowed until a
      # cleanup slice; correctness and suspicious stay denied.
      - name: Clippy
        working-directory: poc
        run: >
          cargo clippy --locked --all-targets --features product --
          -D warnings
          -A clippy::style
          -A clippy::complexity
          -A clippy::pedantic
          -A clippy::nursery
          -A clippy::perf

      # Unit tests before the staged stamp so compiled_version_is_the_version_pri_value
      # sees version.pri, not a PR display suffix.
      - name: Test
        working-directory: poc
        run: cargo test --locked

      - name: Test with product features
        working-directory: poc
        run: cargo test --locked --features product

      - name: Build and stage product release
        shell: cmd
        env:
          OMAIRC_BUILD_VERSION: ${{ env.OMAIRC_DISPLAY_VERSION }}
        run: bin\build-rust.bat

      - name: Assert static CRT
        run: |
          $exe = 'build\release\omairc.exe'
          if (-not (Test-Path $exe)) { throw "Expected $exe" }
          $deps = & dumpbin /dependents $exe | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin /dependents failed' }
          Write-Host $deps
          if ($deps -match '(?i)VCRUNTIME|MSVCP') {
            throw 'Static CRT check failed: exe depends on VCRUNTIME or MSVCP'
          }
          foreach ($name in @('LICENSE', 'OFL.txt', 'COPYING-LGPL')) {
            if (-not (Test-Path (Join-Path 'build\release' $name))) {
              throw "Expected build\release\$name"
            }
          }

      - name: Smoke
        run: |
          $exe = 'build\release\omairc.exe'
          if (-not (Test-Path $exe)) { throw "Expected $exe" }
          $version = (& $exe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -notmatch '^omairc ') { throw "Expected omairc version, got: $version" }
          $help = & $exe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($help -notmatch 'Usage:') { throw "Expected help text, got: $help" }

          $env:OMAIRC_ALLOW_MULTI = '1'
          $env:OMAIRC_SMOKE = '1'
          $full = (Resolve-Path $exe).Path
          $smokeOut = Join-Path $env:RUNNER_TEMP 'omairc-rust-smoke-out.txt'
          $smokeErr = Join-Path $env:RUNNER_TEMP 'omairc-rust-smoke-err.txt'
          $p = Start-Process -FilePath $full -ArgumentList '--demo-server' -PassThru `
            -RedirectStandardOutput $smokeOut -RedirectStandardError $smokeErr
          if (-not $p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'demo-server smoke did not exit within 60s'
          }
          if ($p.ExitCode -ne 0) {
            Write-Host '--- demo-server stdout ---'
            if (Test-Path $smokeOut) { Get-Content $smokeOut -ErrorAction SilentlyContinue }
            Write-Host '--- demo-server stderr ---'
            if (Test-Path $smokeErr) { Get-Content $smokeErr -ErrorAction SilentlyContinue }
            throw "demo-server smoke exited $($p.ExitCode)"
          }

      # Distinct step names from the Qt job so check-conventions keeps that
      # job's package-only-on-tag gate. Rust proves the installer on every run.
      - name: Install Inno Setup for rust
        run: choco install innosetup --no-progress -y

      - name: Package rust installer
        shell: cmd
        env:
          OMAIRC_CLIENT: rust
        run: bin\package-windows.bat

      - name: Smoke rust installer
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "dist\omairc-$($env:OMAIRC_ARTIFACT_VERSION)-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Expected $setup" }

          $configDir = Join-Path $env:LOCALAPPDATA 'omairc'
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          $configPath = Join-Path $configDir 'omairc.conf'
          Set-Content -Path $configPath -Value "[preferences]`r`nmarker=rust-m3-smoke`r`n" -NoNewline

          $envKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $pathBefore = $null
          if ($null -ne $envKey -and $null -ne $envKey.GetValue('Path')) {
            $pathBefore = $envKey.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          }

          $dest = Join-Path $env:RUNNER_TEMP 'omairc-rust-inst'
          # Seed a prior Qt tree so [InstallDelete] is exercised on upgrade.
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path (Join-Path $dest 'platforms') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $dest 'qml\QtQuick') | Out-Null
          Set-Content -Path (Join-Path $dest 'Qt6Core.dll') -Value 'fake-qt-core'
          Set-Content -Path (Join-Path $dest 'Qt6Gui.dll') -Value 'fake-qt-gui'
          Set-Content -Path (Join-Path $dest 'qt6keychain.dll') -Value 'fake-keychain'
          Set-Content -Path (Join-Path $dest 'msvcp140.dll') -Value 'fake-crt'
          Set-Content -Path (Join-Path $dest 'msvcp140_1.dll') -Value 'fake-crt'
          Set-Content -Path (Join-Path $dest 'vcruntime140.dll') -Value 'fake-crt'
          Set-Content -Path (Join-Path $dest 'vcruntime140_1.dll') -Value 'fake-crt'
          Set-Content -Path (Join-Path $dest 'platforms\qwindows.dll') -Value 'fake-platform'
          Set-Content -Path (Join-Path $dest 'qml\QtQuick\qmldir') -Value 'fake-qml'
          Set-Content -Path (Join-Path $dest 'qt.conf') -Value '[Paths]'

          $log = Join-Path $env:RUNNER_TEMP 'omairc-rust-setup.log'
          $setupArgs = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/CURRENTUSER',
            "/DIR=$dest",
            "/LOG=$log"
          )
          $p = Start-Process -FilePath (Resolve-Path $setup).Path -ArgumentList $setupArgs -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "Installer exited $($p.ExitCode)"
          }
          $exe = Join-Path $dest 'omairc.exe'
          if (-not (Test-Path $exe)) { throw "Expected $exe after install" }
          if (-not (Test-Path (Join-Path $dest 'LICENSE.txt'))) {
            throw 'LICENSE.txt was not installed'
          }
          if (-not (Test-Path (Join-Path $dest 'OFL.txt'))) {
            throw 'OFL.txt was not installed'
          }
          if (-not (Test-Path (Join-Path $dest 'COPYING-LGPL'))) {
            throw 'COPYING-LGPL was not installed'
          }
          foreach ($leftover in @(
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'qt6keychain.dll',
            'msvcp140.dll',
            'msvcp140_1.dll',
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'qt.conf',
            'platforms',
            'qml'
          )) {
            if (Test-Path (Join-Path $dest $leftover)) {
              throw "InstallDelete left Qt leftover: $leftover"
            }
          }
          $version = (& $exe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = "omairc $($env:OMAIRC_DISPLAY_VERSION)"
          if ($version -ne $expected) { throw "Expected '$expected', got: $version" }

          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Omairc.lnk'
          if (-not (Test-Path $shortcut)) { throw "Expected Start Menu shortcut $shortcut" }
          # Inno writes AppUserModel_* into the .lnk property store. AUMID is
          # often UTF-16LE (or ASCII); ToastActivatorCLSID is typically the
          # 16-byte Windows GUID layout, not the braced/text GUID string.
          $lnkBytes = [System.IO.File]::ReadAllBytes($shortcut)
          $lnkHex = [System.BitConverter]::ToString($lnkBytes).Replace('-', '')
          function Test-LnkContains([string]$text) {
            $asciiHex = [System.BitConverter]::ToString(
              [System.Text.Encoding]::ASCII.GetBytes($text)
            ).Replace('-', '')
            $utf16Hex = [System.BitConverter]::ToString(
              [System.Text.Encoding]::Unicode.GetBytes($text)
            ).Replace('-', '')
            return ($lnkHex -like "*$asciiHex*") -or ($lnkHex -like "*$utf16Hex*")
          }
          if (-not (Test-LnkContains 'FrediMachado.Omairc')) {
            throw 'Start Menu shortcut is missing AppUserModelID FrediMachado.Omairc'
          }
          # DBE38477-5F87-42A1-AFA1-11FA12F2E5E5 as mixed-endian GUID bytes.
          $toastClsidBlob = '7784E3DB875FA142AFA111FA12F2E5E5'
          $toastClsidText = 'DBE38477-5F87-42A1-AFA1-11FA12F2E5E5'
          if (-not (
            ($lnkHex -like "*$toastClsidBlob*") -or
            (Test-LnkContains $toastClsidText) -or
            (Test-LnkContains "{$toastClsidText}")
          )) {
            throw 'Start Menu shortcut is missing toast activator CLSID'
          }

          $unins = Join-Path $dest 'unins000.exe'
          if (-not (Test-Path $unins)) { throw "Expected $unins" }
          $uninsLog = Join-Path $env:RUNNER_TEMP 'omairc-rust-unins.log'
          $uninsArgs = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/LOG=$uninsLog"
          )
          Start-Process -FilePath $unins -ArgumentList $uninsArgs | Out-Null
          # Inno does not remove {app} when the smoke pre-created it for
          # InstallDelete; wait for product files to leave, not the directory.
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path $exe) -or (Test-Path $unins)) {
            if ((Get-Date) -gt $deadline) {
              if (Test-Path $uninsLog) { Get-Content $uninsLog }
              if (Test-Path $log) { Get-Content $log }
              throw "Uninstall did not remove $exe (or unins stub still present)"
            }
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $exe) { throw 'omairc.exe still present after uninstall' }
          if (Test-Path $shortcut) { throw 'Start Menu shortcut still present after uninstall' }
          if (Test-Path $dest) {
            foreach ($product in @(
              'omairc.exe',
              'LICENSE.txt',
              'OFL.txt',
              'COPYING-LGPL',
              'unins000.exe',
              'unins000.dat'
            )) {
              if (Test-Path (Join-Path $dest $product)) {
                throw "Uninstall left product file: $product"
              }
            }
          }
          if (-not (Test-Path $configPath)) {
            throw "%LOCALAPPDATA%\omairc\omairc.conf was removed by uninstall"
          }
          $configText = Get-Content -Raw $configPath
          if ($configText -notmatch 'rust-m3-smoke') {
            throw '%LOCALAPPDATA%\omairc did not keep the smoke marker'
          }

          $pathDeadline = (Get-Date).AddSeconds(15)
          do {
            $envKeyAfter = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
            $pathAfter = $null
            if ($null -ne $envKeyAfter -and $null -ne $envKeyAfter.GetValue('Path')) {
              $pathAfter = $envKeyAfter.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            }
            if ($pathBefore -ceq $pathAfter) { break }
            if ((Get-Date) -gt $pathDeadline) {
              if (Test-Path $uninsLog) { Get-Content $uninsLog }
              throw "Path mutated by install/uninstall. before=[$pathBefore] after=[$pathAfter]"
            }
            Start-Sleep -Milliseconds 200
          } while ($true)
          $mb = [math]::Round(((Get-Item $setup).Length) / 1MB, 2)
          Write-Host "Rust installer smoke ok: $setup ($mb MB); InstallDelete cleared Qt leftovers; config survived uninstall"

  windows:
    needs: changes
    if: needs.changes.outputs.qt == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_VERSION: 6.8.3
      QTKEYCHAIN_VERSION: 0.15.0
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Derive versions
        run: |
          python bin/derive-build-versions.py `
            --git-ref "$env:GITHUB_REF" `
            --sha "$env:GITHUB_SHA" `
            --run-number "$env:GITHUB_RUN_NUMBER" `
            --run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --format github-env `
            --github-env "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "OMAIRC_BUILD_NUMBER=$env:GITHUB_RUN_NUMBER"
          Get-Content $env:GITHUB_ENV | Select-String '^OMAIRC_'

      - name: Assert tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) { throw "Expected v* tag, got $tag" }
          $expected = $tag.Substring(1)
          if ($expected -ne $env:OMAIRC_VERSION) {
            throw "Tag $tag does not match version.pri $($env:OMAIRC_VERSION)"
          }
          if ($env:OMAIRC_DISPLAY_VERSION -ne $env:OMAIRC_VERSION) {
            throw "Tag builds must keep unsuffixed display version"
          }
          if ($env:OMAIRC_ARTIFACT_VERSION -ne $env:OMAIRC_VERSION) {
            throw "Tag builds must keep unsuffixed artifact version"
          }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ env.QT_VERSION }}-win64_msvc2022_64-qtkeychain-${{ env.QTKEYCHAIN_VERSION }}

      - name: Install Qt 6
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "$env:RUNNER_TEMP\aqt"
          & "$env:RUNNER_TEMP\aqt\Scripts\pip" install aqtinstall
          & "$env:RUNNER_TEMP\aqt\Scripts\aqt" install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 `
            -O "$env:RUNNER_TEMP\Qt"

      - name: Add Qt to PATH
        run: |
          $qtBin = Join-Path $env:RUNNER_TEMP "Qt\$env:QT_VERSION\msvc2022_64\bin"
          if (-not (Test-Path (Join-Path $qtBin 'qmake.exe'))) {
            throw "qmake not found at $qtBin"
          }
          Add-Content $env:GITHUB_PATH $qtBin
          Add-Content $env:GITHUB_ENV "QMAKE=$qtBin\qmake.exe"

      - name: Install QtKeychain
        run: |
          $qmake = $env:QMAKE
          $qtPrefix = & $qmake -query QT_INSTALL_PREFIX
          $pri = Join-Path (& $qmake -query QT_INSTALL_ARCHDATA) 'mkspecs\modules\qt_Qt6Keychain.pri'
          if (Test-Path $pri) {
            Write-Host "QtKeychain already at $pri"
            exit 0
          }
          $src = Join-Path $env:RUNNER_TEMP 'qtkeychain-src'
          $build = Join-Path $env:RUNNER_TEMP 'qtkeychain-build'
          git clone --depth 1 --branch $env:QTKEYCHAIN_VERSION `
            https://github.com/frankosterfeld/qtkeychain.git $src
          cmake -S $src -B $build -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtPrefix" `
            -DCMAKE_INSTALL_PREFIX="$qtPrefix" `
            -DBUILD_WITH_QT6=ON `
            -DBUILD_TRANSLATIONS=OFF `
            -DBUILD_TEST_APPLICATION=OFF `
            -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $pri)) {
            throw "QtKeychain installed but $pri is missing."
          }

      - name: Build
        shell: cmd
        run: bin\build.bat

      - name: Smoke
        run: |
          $exe = 'build\release\omairc.exe'
          if (-not (Test-Path $exe)) { throw "Expected $exe" }
          $keychain = Get-ChildItem 'build\release' -Filter '*qt6keychain.dll' -File
          if (-not $keychain) { throw 'qt6keychain.dll was not deployed next to the exe' }
          if (-not (Test-Path 'build\release\msvcp140.dll')) {
            throw 'msvcp140.dll was not deployed next to the exe'
          }
          $svg = Get-ChildItem 'build\release' -Recurse -Filter 'qsvg.dll' -File
          if (-not $svg) { throw 'qsvg.dll was not deployed (About overlay SVG)' }
          $dialogs = Get-ChildItem 'build\release\qml\QtQuick\Dialogs' -Recurse -Filter '*.dll' -File -ErrorAction SilentlyContinue
          if (-not $dialogs) { throw 'QtQuick.Dialogs was not deployed (file picker)' }
          $version = (& $exe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = "omairc $($env:OMAIRC_DISPLAY_VERSION)"
          if ($version -ne $expected) { throw "Expected '$expected', got: $version" }
          $help = & $exe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($help -notmatch 'Usage:') { throw "Expected help text, got: $help" }

          $env:OMAIRC_ALLOW_MULTI = '1'
          $env:OMAIRC_SMOKE = '1'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $qtPlugins = Join-Path $env:RUNNER_TEMP "Qt\$env:QT_VERSION\msvc2022_64\plugins"
          if (Test-Path $qtPlugins) { $env:QT_PLUGIN_PATH = $qtPlugins }
          $full = (Resolve-Path $exe).Path
          $smokeOut = Join-Path $env:RUNNER_TEMP 'omairc-smoke-out.txt'
          $smokeErr = Join-Path $env:RUNNER_TEMP 'omairc-smoke-err.txt'
          $p = Start-Process -FilePath $full -ArgumentList '--demo-server' -PassThru -RedirectStandardOutput $smokeOut -RedirectStandardError $smokeErr
          if (-not $p.WaitForExit(30000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'demo-server smoke did not exit within 30s'
          }
          if ($p.ExitCode -ne 0) {
            Write-Host '--- demo-server stdout ---'
            if (Test-Path $smokeOut) { Get-Content $smokeOut -ErrorAction SilentlyContinue }
            Write-Host '--- demo-server stderr ---'
            if (Test-Path $smokeErr) { Get-Content $smokeErr -ErrorAction SilentlyContinue }
            throw "demo-server smoke exited $($p.ExitCode)"
          }

          $junk = @('*.obj','*.pdb','*.res','*.ilk','moc_*.cpp','moc_predefs.h','qrc_*.cpp')
          Get-ChildItem 'build\release' -File | Where-Object {
            foreach ($pat in $junk) { if ($_.Name -like $pat) { return $true } }
            $false
          } | Remove-Item -Force
          $files = Get-ChildItem 'build\release' -Recurse -File
          $mb = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 2)
          Write-Host "Portable tree: $($files.Count) files, $mb MB"

      # Compile and smoke on every push and PR. Package and upload only on
      # version tags and a manual workflow_dispatch when someone needs the
      # zip/setup. Master merges skip that work.
      - name: Upload portable tree
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: omairc-${{ env.OMAIRC_ARTIFACT_VERSION }}-windows-x64
          path: |
            build/release/**
            !build/release/*.obj
            !build/release/*.pdb
            !build/release/*.res
            !build/release/*.ilk
            !build/release/moc_*
            !build/release/qrc_*
          if-no-files-found: error

      - name: Install Inno Setup
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup --no-progress -y

      - name: Package installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: cmd
        run: bin\package-windows.bat

      - name: Smoke installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "dist\omairc-$($env:OMAIRC_ARTIFACT_VERSION)-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Expected $setup" }

          $envKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $pathBefore = $null
          if ($null -ne $envKey -and $null -ne $envKey.GetValue('Path')) {
            $pathBefore = $envKey.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          }

          $dest = Join-Path $env:RUNNER_TEMP 'omairc-inst'
          $log = Join-Path $env:RUNNER_TEMP 'omairc-setup.log'
          $setupArgs = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/CURRENTUSER',
            "/DIR=$dest",
            "/LOG=$log"
          )
          $p = Start-Process -FilePath (Resolve-Path $setup).Path -ArgumentList $setupArgs -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "Installer exited $($p.ExitCode)"
          }
          $exe = Join-Path $dest 'omairc.exe'
          if (-not (Test-Path $exe)) { throw "Expected $exe after install" }
          if (-not (Test-Path (Join-Path $dest 'LICENSE.txt'))) {
            throw 'LICENSE.txt was not installed'
          }
          if (-not (Test-Path (Join-Path $dest 'msvcp140.dll'))) {
            throw 'msvcp140.dll was not installed'
          }
          $version = (& $exe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = "omairc $($env:OMAIRC_DISPLAY_VERSION)"
          if ($version -ne $expected) { throw "Expected '$expected', got: $version" }
          $mb = [math]::Round(((Get-Item $setup).Length) / 1MB, 2)
          Write-Host "Installer: $setup ($mb MB)"

          $unins = Join-Path $dest 'unins000.exe'
          if (-not (Test-Path $unins)) { throw "Expected $unins" }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Omairc.lnk'
          $uninsLog = Join-Path $env:RUNNER_TEMP 'omairc-unins.log'
          $uninsArgs = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/LOG=$uninsLog"
          )
          Start-Process -FilePath $unins -ArgumentList $uninsArgs | Out-Null
          $deadline = (Get-Date).AddMinutes(2)
          while (Test-Path $dest) {
            if ((Get-Date) -gt $deadline) {
              if (Test-Path $uninsLog) { Get-Content $uninsLog }
              if (Test-Path $log) { Get-Content $log }
              throw "Uninstall did not remove $dest"
            }
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $exe) { throw 'omairc.exe still present after uninstall' }
          if (Test-Path $shortcut) { throw 'Start Menu shortcut still present after uninstall' }

          $pathDeadline = (Get-Date).AddSeconds(15)
          do {
            $envKeyAfter = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
            $pathAfter = $null
            if ($null -ne $envKeyAfter -and $null -ne $envKeyAfter.GetValue('Path')) {
              $pathAfter = $envKeyAfter.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            }
            if ($pathBefore -ceq $pathAfter) { break }
            if ((Get-Date) -gt $pathDeadline) {
              if (Test-Path $uninsLog) { Get-Content $uninsLog }
              throw "Path mutated by install/uninstall. before=[$pathBefore] after=[$pathAfter]"
            }
            Start-Sleep -Milliseconds 200
          } while ($true)
          Write-Host 'Uninstall removed the install dir and Start Menu shortcut; Path is unchanged'

      - name: Upload installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: omairc-${{ env.OMAIRC_ARTIFACT_VERSION }}-windows-x64-setup
          path: dist/omairc-${{ env.OMAIRC_ARTIFACT_VERSION }}-windows-x64-setup.exe
          if-no-files-found: error

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ver = $env:OMAIRC_VERSION
          $name = "omairc-$ver-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path 'build\release\*' -Destination $stage -Recurse
          $zip = Join-Path (Get-Location) "$name.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 2)
          Write-Host "Release zip: $zip ($mb MB)"

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $ver = $env:OMAIRC_VERSION
          $zipName = "omairc-$ver-windows-x64.zip"
          $setupName = "omairc-$ver-windows-x64-setup.exe"
          $setupPath = Join-Path 'dist' $setupName
          if (-not (Test-Path $zipName)) { throw "Missing $zipName" }
          if (-not (Test-Path $setupPath)) { throw "Missing $setupPath" }

          # Release package creates the GitHub Release; wait if this job finishes first.
          $deadline = (Get-Date).AddMinutes(30)
          while ($true) {
            gh release view $tag 1>$null 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            if ((Get-Date) -gt $deadline) {
              throw "Timed out waiting for GitHub Release $tag (created by Release package)"
            }
            Write-Host "Waiting for release $tag..."
            Start-Sleep -Seconds 15
          }

          $assetList = gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "gh release view $tag failed" }
          foreach ($asset in @($assetList)) {
            if (-not $asset) { continue }
            if ($asset -like 'omairc-[0-9]*-windows-x64.zip' -and $asset -ne $zipName) {
              gh release delete-asset $tag $asset --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale asset $asset" }
            }
            if ($asset -like 'omairc-[0-9]*-windows-x64-setup.exe' -and $asset -ne $setupName) {
              gh release delete-asset $tag $asset --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale asset $asset" }
            }
          }

          gh release upload $tag $zipName $setupPath --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Windows assets" }
