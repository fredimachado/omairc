name: Rebuild Omairc website on release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-website:
    runs-on: ubuntu-latest
    steps:
      - name: Require website dispatch token
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: test -n "$TOKEN" || { echo "WEBSITE_DISPATCH_TOKEN is not configured" >&2; exit 1; }

      - name: Dispatch website deployment
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: gh workflow run deploy-pages.yml --repo fredimachado/omairc-web --ref main
