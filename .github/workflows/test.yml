name: Test

on:
  pull_request:
    # Ignore other .github paths, but not workflows/test.yml: a blanket
    # `.github/**` skip would let workflow-only PRs miss the Linux rust gate.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/workflows/windows.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/tui.yml'
      - '.github/workflows/release-package.yml'
      - '.github/workflows/rebuild-website.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.cursor/**'
      - 'omairc.gif'
      - 'omairc.png'
      - 'tui/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/workflows/windows.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/tui.yml'
      - '.github/workflows/release-package.yml'
      - '.github/workflows/rebuild-website.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.cursor/**'
      - 'omairc.gif'
      - 'omairc.png'
      - 'tui/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require main or a phase branch as the pull request base
        run: |
          case "${{ github.base_ref }}" in
            main|tui-phase-*|slice/rust-cutover-*) ;;
            *) echo "This pull request targets ${{ github.base_ref }}, not main, a tui-phase branch, or a slice/rust-cutover branch." >&2; exit 1 ;;
          esac

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # bin/test invokes tui/bin/test when go is on PATH, so pin the toolchain
      # here rather than relying on the runner's preinstalled Go.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: tui/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: poc
          key: linux-rust-${{ hashFiles('poc/Cargo.lock') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 python3-venv \
            cmake ninja-build pkg-config libsecret-1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 \
            libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libx11-xcb1

      # Fail fast on the Rust client before the Qt install. bin/test below still
      # runs plain `cargo test` (default features); product features and clippy
      # are the M1 extras that only this job owns.
      # -D warnings catches unused_imports (the Windows break class). Style and
      # complexity groups are pre-existing noise; allow them until a cleanup
      # slice. correctness and suspicious stay denied.
      - name: Clippy
        working-directory: poc
        run: >
          cargo clippy --locked --all-targets --features product --
          -D warnings
          -A clippy::style
          -A clippy::complexity
          -A clippy::pedantic
          -A clippy::nursery
          -A clippy::perf

      - name: Cargo test with product features
        working-directory: poc
        run: cargo test --locked --features product

      - name: Install Qt 6
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt linux desktop 6.8.3 linux_gcc_64 -O "$HOME/Qt"
          echo "$HOME/Qt/6.8.3/gcc_64/bin" >> "$GITHUB_PATH"
          {
            echo "LD_LIBRARY_PATH=$HOME/Qt/6.8.3/gcc_64/lib:${LD_LIBRARY_PATH:-}"
            echo "QT_PLUGIN_PATH=$HOME/Qt/6.8.3/gcc_64/plugins"
            echo "QML2_IMPORT_PATH=$HOME/Qt/6.8.3/gcc_64/qml"
          } >> "$GITHUB_ENV"

      - name: Install QtKeychain
        run: bin/install-qtkeychain "$HOME/Qt/6.8.3/gcc_64"

      - name: Run bin/test
        run: bin/test

  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 python3-venv \
            cmake ninja-build pkg-config libsecret-1-dev \
            libgl1-mesa-dev libdbus-1-dev

      - name: Install Qt 6
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt linux desktop 6.8.3 linux_gcc_64 -O "$HOME/Qt"
          echo "$HOME/Qt/6.8.3/gcc_64/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/Qt/6.8.3/gcc_64/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install QtKeychain
        run: bin/install-qtkeychain "$HOME/Qt/6.8.3/gcc_64"

      - name: Build protocol_tests with ASan and UBSan
        run: bin/test-san

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 python3-venv \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 \
            libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libx11-xcb1 \
            libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: poc -> target

      - name: Install Qt 6 with Quick
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt linux desktop 6.8.3 linux_gcc_64 -O "$HOME/Qt"
          echo "$HOME/Qt/6.8.3/gcc_64/bin" >> "$GITHUB_PATH"
          {
            echo "LD_LIBRARY_PATH=$HOME/Qt/6.8.3/gcc_64/lib:${LD_LIBRARY_PATH:-}"
            echo "QT_PLUGIN_PATH=$HOME/Qt/6.8.3/gcc_64/plugins"
            echo "QML2_IMPORT_PATH=$HOME/Qt/6.8.3/gcc_64/qml"
          } >> "$GITHUB_ENV"

      - name: Run bin/test-live
        env:
          OMAIRC_LIVE_PROFILE: l1
        run: bin/test-live

      - name: Upload live UI artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui
          path: test-artifacts/live-ui/
          if-no-files-found: ignore

  # Feature-map recipes against the Rust client (Xvfb + lavapipe). Non-blocking
  # until the XI2 click path and recipe set are stable enough to gate merges.
  verify-poc:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: poc
          key: linux-verify-poc-${{ hashFiles('poc/Cargo.lock') }}

      - name: Install desktop and lavapipe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libx11-xcb1 \
            libdbus-1-dev libssl-dev \
            xvfb xauth xdotool xinput imagemagick \
            mesa-vulkan-drivers

      - name: Run feature-map recipes (control-omairc-poc)
        run: bin/verify-poc-recipes

      - name: Upload verify-poc artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-poc
          path: test-artifacts/verify-poc/
          if-no-files-found: ignore
