name: Test

on:
  pull_request:
    # Ignore other .github paths, but not workflows/test.yml: a blanket
    # `.github/**` skip would let workflow-only PRs miss the Linux rust gate.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/workflows/windows.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/tui.yml'
      - '.github/workflows/release-package.yml'
      - '.github/workflows/rebuild-website.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.cursor/**'
      - 'omairc.gif'
      - 'omairc.png'
      - 'tui/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/workflows/windows.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/tui.yml'
      - '.github/workflows/release-package.yml'
      - '.github/workflows/rebuild-website.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.cursor/**'
      - 'omairc.gif'
      - 'omairc.png'
      - 'tui/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require main or a phase branch as the pull request base
        run: |
          case "${{ github.base_ref }}" in
            main|tui-phase-*|slice/rust-cutover-*) ;;
            *) echo "This pull request targets ${{ github.base_ref }}, not main, a tui-phase branch, or a slice/rust-cutover branch." >&2; exit 1 ;;
          esac

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # bin/test invokes tui/bin/test when go is on PATH, so pin the toolchain
      # here rather than relying on the runner's preinstalled Go.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: tui/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: linux-rust-${{ hashFiles('client/Cargo.lock') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 \
            pkg-config libsecret-1-dev \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 \
            libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-3 libdbus-1-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libx11-xcb1

      # bin/test runs conventions, cargo test + clippy, version/help smoke, and
      # the TUI gate. -D warnings catches unused_imports. Style and complexity
      # groups stay allowed until a cleanup slice.
      - name: Run bin/test
        run: bin/test

  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: linux-san-${{ hashFiles('client/Cargo.lock') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libsecret-1-dev \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 \
            libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libx11-xcb1

      - name: Run bin/test-san
        run: bin/test-san

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 \
            libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-3 libdbus-1-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libx11-xcb1 \
            libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client -> target

      - name: Run bin/test-live
        env:
          OMAIRC_LIVE_PROFILE: l1
        run: bin/test-live

  # Dry-build the root PKGBUILD in an Arch container so a packaging regression
  # fails the pull request instead of release-package.yml's tag job, which both
  # builds this package and creates the GitHub Release. Tags skip it;
  # release-package.yml builds the same package there.
  arch-package:
    name: Arch package
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Bootstrap pacman
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo python

      - uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: /home/builder/.cargo/registry
          key: arch-package-cargo-${{ hashFiles('client/Cargo.lock') }}

      - name: Fix cargo cache ownership
        run: |
          mkdir -p /home/builder/.cargo/registry
          chown -R builder:builder /home/builder/.cargo

      - name: Prepare dry-build source
        run: |
          set -euo pipefail
          pkgver=$(./bin/version)
          tag_source="omairc-${pkgver}.tar.gz::https://github.com/fredimachado/omairc/archive/refs/tags/v${pkgver}.tar.gz"
          source0=$(bash -c 'source ./PKGBUILD; printf %s "${source[0]}"')
          test "$source0" = "$tag_source" || {
            echo "PKGBUILD must fetch the tag tarball $tag_source" >&2
            printf 'got: %s\n' "$source0" >&2
            exit 1
          }
          source_tar=$(mktemp "/tmp/omairc-${pkgver}.XXXXXX.tar.gz")
          tar --exclude='.git' --exclude='.arena-omairc-pacman' \
            -czf "$source_tar" \
            --transform "s,^\.,omairc-${pkgver}," .
          mv "$source_tar" "omairc-${pkgver}.tar.gz"
          sed -i "s|^source=.*|source=(\"omairc-${pkgver}.tar.gz\")|" PKGBUILD
          chown builder:builder "omairc-${pkgver}.tar.gz" PKGBUILD version.pri

      - name: makepkg
        run: |
          set -euo pipefail
          sudo -u builder env OMAIRC_BUILD_VERSION="$(./bin/version)" makepkg -s --noconfirm

      - name: Verify package metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(omairc-[0-9]*-x86_64.pkg.tar.zst)
          test "${#pkgs[@]}" -eq 1
          version=$(./bin/version)
          meta=$(pacman -Qp "${pkgs[0]}")
          test "$meta" = "omairc ${version}-1"
          tmp=$(mktemp -d)
          tar -xf "${pkgs[0]}" -C "$tmp" usr/bin/omairc
          got=$("$tmp/usr/bin/omairc" --version)
          rm -rf "$tmp"
          test "$got" = "omairc $version"
          expected="$(printf '%s\n' \
            usr/bin/omairc \
            usr/share/applications/omairc.desktop \
            usr/share/bash-completion/completions/omairc \
            usr/share/icons/hicolor/scalable/apps/omairc.svg \
            usr/share/licenses/omairc/LICENSE \
            usr/share/licenses/omairc/OFL.txt | sort)"
          got_files="$(bsdtar -tf "${pkgs[0]}" | grep -v '^\.' | grep -v '/$' | sort)"
          test "$got_files" = "$expected" || {
            echo "package file list must match bin/test-install's six paths" >&2
            printf 'got:\n%s\n' "$got_files" >&2
            printf 'want:\n%s\n' "$expected" >&2
            exit 1
          }

  # Feature-map recipes against the Rust client (Xvfb + lavapipe). Non-blocking
  # until the XI2 click path and recipe set are stable enough to gate merges.
  verify-poc:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: linux-verify-poc-${{ hashFiles('client/Cargo.lock') }}

      - name: Install desktop and lavapipe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libx11-xcb1 \
            libdbus-1-dev libssl-dev \
            xvfb xauth xdotool xinput imagemagick \
            mesa-vulkan-drivers
          # Ubuntu ships ImageMagick 6 without the unified `magick` entrypoint
          # that ImageMagick 7 / Omarchy provide and that control-omairc-poc
          # doctor / screenshots require (same shim as .cursor/install.sh).
          sudo tee /usr/local/bin/magick >/dev/null <<'EOF'
          #!/usr/bin/env sh
          set -eu
          case "${1:-}" in
            convert|mogrify|identify|composite|montage|compare|import|conjure|stream|display|animate)
              cmd="$1"; shift; exec "$cmd" "$@" ;;
            *)
              exec convert "$@" ;;
          esac
          EOF
          sudo chmod +x /usr/local/bin/magick
          command -v magick
          command -v xdotool
          command -v xinput
          command -v Xvfb
          command -v import
          ls /usr/share/vulkan/icd.d/*lvp* /usr/share/vulkan/icd.d/*lavapipe* 2>/dev/null \
            || ls /usr/share/vulkan/icd.d/*.json

      - name: Run feature-map recipes (control-omairc-poc)
        run: bin/verify-poc-recipes

      - name: Upload verify-poc artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-poc
          path: test-artifacts/verify-poc/
          if-no-files-found: ignore
