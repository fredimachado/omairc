name: macOS build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/macos.yml'
      - 'bin/build-macos-rust'
      - 'bin/derive-build-versions.py'
      - 'bin/package-macos'
      - 'bin/sign-macos'
      - 'bin/notarize-macos'
      - 'bin/check-macos-bundle'
      - 'bin/check-macos-syspolicy'
      - 'packaging/macos/**'
      - 'version.pri'
      - 'client/**'
      - 'fonts/**'
      - 'data/icons/**'
      - 'LICENSE'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/macos.yml'
      - 'bin/build-macos-rust'
      - 'bin/derive-build-versions.py'
      - 'bin/package-macos'
      - 'bin/sign-macos'
      - 'bin/notarize-macos'
      - 'bin/check-macos-bundle'
      - 'bin/check-macos-syspolicy'
      - 'packaging/macos/**'
      - 'version.pri'
      - 'client/**'
      - 'fonts/**'
      - 'data/icons/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.select.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        with:
          filters: |
            rust:
              - 'client/**'
              - 'version.pri'
              - 'fonts/**'
              - 'data/icons/**'
              - 'packaging/macos/**'
              - 'bin/build-macos-rust'
              - 'bin/package-macos'
              - 'bin/sign-macos'
              - 'bin/notarize-macos'
              - 'bin/check-macos-bundle'
              - 'bin/check-macos-syspolicy'
              - 'bin/derive-build-versions.py'
              - '.github/workflows/macos.yml'
              - 'LICENSE'
      - name: Select jobs
        id: select
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rust=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust ${{ matrix.suffix }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is macOS 26 and no longer ships Xcode 16. macos-15
          # ARM64 and macos-15-intel both install Xcode 16.4.
          - os: macos-15
            suffix: macos-arm64
            macho: arm64
            xcode: "16.4"
          - os: macos-15-intel
            suffix: macos-x64
            macho: x86_64
            xcode: "16.4"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Derive versions
        run: |
          set -euo pipefail
          python3 bin/derive-build-versions.py \
            --git-ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --format github-env \
            --github-env "$GITHUB_ENV"
          echo "OMAIRC_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          # Keep display/artifact for packaging names. Clear the cargo stamp so
          # Clippy/Test read version.pri (build.rs treats empty as unset).
          # bin/build-macos-rust gets OMAIRC_BUILD_VERSION only on the Build step.
          echo "OMAIRC_BUILD_VERSION=" >> "$GITHUB_ENV"
          grep '^OMAIRC_' "$GITHUB_ENV" | tail -8

      - name: Assert tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          python3 bin/check-conventions
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$OMAIRC_VERSION"
          test "$OMAIRC_DISPLAY_VERSION" = "$OMAIRC_VERSION"
          test "$OMAIRC_ARTIFACT_VERSION" = "$OMAIRC_VERSION"

      - name: Select host arch
        env:
          MATRIX_MACHO: ${{ matrix.macho }}
          MATRIX_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          host="$(uname -m)"
          if [ "$host" != "$MATRIX_MACHO" ]; then
            echo "Runner architecture $host does not match matrix $MATRIX_MACHO" >&2
            exit 1
          fi
          case "$host" in
            arm64)
              omairc_mac_suffix=macos-arm64
              expected_macho_arch=arm64
              ;;
            x86_64)
              omairc_mac_suffix=macos-x64
              expected_macho_arch=x86_64
              ;;
            *)
              echo "Unsupported runner architecture: $host" >&2
              exit 1
              ;;
          esac
          if [ "$omairc_mac_suffix" != "$MATRIX_SUFFIX" ]; then
            echo "Derived suffix $omairc_mac_suffix does not match matrix $MATRIX_SUFFIX" >&2
            exit 1
          fi
          echo "OMAIRC_MAC_SUFFIX=$omairc_mac_suffix" >> "$GITHUB_ENV"
          echo "EXPECTED_MACHO_ARCH=$expected_macho_arch" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: macos-rust-${{ matrix.suffix }}-${{ hashFiles('client/Cargo.lock') }}

      # Same product clippy as Linux test.yml so platform-only unused_imports
      # cannot regress green. Style/complexity groups stay allowed until a
      # cleanup slice; correctness and suspicious stay denied.
      - name: Clippy
        working-directory: client
        run: >
          cargo clippy --locked --all-targets --features product --
          -D warnings
          -A clippy::style
          -A clippy::complexity
          -A clippy::pedantic
          -A clippy::nursery
          -A clippy::perf

      # Unit tests before the staged stamp so compiled_version_is_the_version_pri_value
      # sees version.pri, not a PR display suffix.
      - name: Test
        working-directory: client
        run: cargo test --locked

      - name: Test with product features
        working-directory: client
        run: cargo test --locked --features product

      # Developer ID + notary credentials. Pull requests stay ad-hoc when secrets
      # are absent. Tag releases require APPLE_CERTIFICATE (and notary keys).
      - name: Import Developer ID certificate for rust
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          is_tag=0
          case "${GITHUB_REF:-}" in
            refs/tags/v*) is_tag=1 ;;
          esac

          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            if [ "$is_tag" -eq 1 ]; then
              echo "Tag releases require APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD." >&2
              exit 1
            fi
            echo "No Developer ID certificate; rust omairc.app will stay ad-hoc."
            exit 0
          fi

          if [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ] || \
             [ -z "${APP_STORE_CONNECT_KEY_ID:-}" ] || \
             [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            if [ "$is_tag" -eq 1 ]; then
              echo "Tag releases require App Store Connect API key, key id, and issuer." >&2
              exit 1
            fi
            echo "Developer ID present without notary credentials; the zip will be signed but not notarized."
          fi

          cert_path="$RUNNER_TEMP/developer-id-rust.p12"
          python3 -c 'import base64, os, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"]))' "$cert_path"

          keychain_path="$RUNNER_TEMP/omairc-rust-signing.keychain-db"
          keychain_password=$(uuidgen)
          security delete-keychain "$keychain_path" 2>/dev/null || true
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          curl -fsSL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" \
            -o "$RUNNER_TEMP/DeveloperIDG2CA-rust.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA-rust.cer" -k "$keychain_path" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security import "$cert_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain_path" >/dev/null
          existing=$(security list-keychains -d user | sed 's/"//g')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain_path" $existing

          identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | awk -F '"' '/Developer ID Application/{print $2; exit}')
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity in the imported certificate." >&2
            security find-identity -v -p codesigning "$keychain_path" >&2 || true
            exit 1
          fi
          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            case "$identity" in
              *"$APPLE_TEAM_ID"*) ;;
              *)
                echo "Imported identity does not contain APPLE_TEAM_ID=$APPLE_TEAM_ID: $identity" >&2
                exit 1
                ;;
            esac
          fi

          {
            echo "CODESIGN_IDENTITY=$identity"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID:-}"
            echo "OMAIRC_REQUIRE_DEVELOPER_ID=1"
            echo "MACOS_RUST_SIGNING_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

          if [ -n "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ] && \
             [ -n "${APP_STORE_CONNECT_KEY_ID:-}" ] && \
             [ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            key_path="$RUNNER_TEMP/AuthKey-rust.p8"
            python3 -c 'import os, pathlib, sys; text = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].replace("\\n", "\n"); pathlib.Path(sys.argv[1]).write_text(text if text.endswith("\n") else text + "\n", encoding="utf-8")' "$key_path"
            chmod 600 "$key_path"
            {
              echo "APP_STORE_CONNECT_API_KEY_PATH=$key_path"
              echo "APP_STORE_CONNECT_KEY_ID=$APP_STORE_CONNECT_KEY_ID"
              echo "APP_STORE_CONNECT_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID"
            } >> "$GITHUB_ENV"
          fi

          rm -f "$cert_path"
          echo "Imported $identity for rust release bundle"

      - name: Build rust app bundle
        env:
          OMAIRC_BUILD_VERSION: ${{ env.OMAIRC_DISPLAY_VERSION }}
        run: bin/build-macos-rust

      - name: Smoke rust app bundle
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/build/omairc.app"
          exe="$app/Contents/MacOS/omairc"
          test -x "$exe"
          test ! -e "$app/Contents/Frameworks"
          test ! -e "$app/Contents/PlugIns"
          test ! -e "$app/Contents/Resources/qml"
          test ! -e "$app/Contents/Resources/qt.conf"
          test ! -e "$app/Contents/MacOS/qt.conf"
          test -f "$app/Contents/Resources/omairc.icns"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$app/Contents/Info.plist")
          test "$bundle_id" = "app.omairc.Omairc"
          short_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$app/Contents/Info.plist")
          build_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$app/Contents/Info.plist")
          test "$short_version" = "$OMAIRC_VERSION"
          test "$build_version" = "$OMAIRC_BUILD_NUMBER"
          archs=$(lipo -archs "$exe" 2>/dev/null || true)
          if [ -z "$archs" ]; then
            archs=$(file -b "$exe")
          fi
          echo "Mach-O archs: $archs (expect $EXPECTED_MACHO_ARCH, artifact $OMAIRC_MAC_SUFFIX)"
          case "$archs" in
            *"$EXPECTED_MACHO_ARCH"*) ;;
            *)
              echo "Binary missing $EXPECTED_MACHO_ARCH (got: $archs); refusing $OMAIRC_MAC_SUFFIX" >&2
              exit 1
              ;;
          esac
          version=$("$exe" --version 2>&1)
          expected="omairc $OMAIRC_DISPLAY_VERSION"
          test "$version" = "$expected" || {
            echo "Expected '$expected', got: $version" >&2
            exit 1
          }
          help=$("$exe" --help 2>&1)
          case "$help" in
            *Usage:*) ;;
            *) echo "Expected help text, got: $help" >&2; exit 1 ;;
          esac
          bin/check-macos-bundle "$app"
          export OMAIRC_ALLOW_MULTI=1
          export OMAIRC_SMOKE=1
          smoke() {
            local bin="$1"
            "$bin" --demo-server &
            local pid=$!
            for _ in $(seq 1 120); do
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid"
                return $?
              fi
              sleep 0.5
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "demo-server smoke did not exit within 60s ($bin)" >&2
            return 1
          }
          smoke "$exe"
          link="$GITHUB_WORKSPACE/build/omairc"
          test -L "$link"
          smoke "$link"

      # Prove the zip layout on every run. Upload / notarize / publish stay
      # gated to workflow_dispatch and v* tags (cask names match Qt's).
      - name: Package rust app zip
        run: bin/package-macos

      - name: Assert rust app zip
        run: |
          set -euo pipefail
          zip="$GITHUB_WORKSPACE/dist/omairc-${OMAIRC_ARTIFACT_VERSION}-${OMAIRC_MAC_SUFFIX}.zip"
          test -f "$zip"
          echo "Rust app zip ok: $zip ($(wc -c <"$zip") bytes)"

      - name: Verify Developer ID signature
        if: env.CODESIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/build/omairc.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app"
          codesign -d --entitlements :- "$app"
          bin/check-macos-bundle "$app"
          bin/check-macos-syspolicy notary-submission "$app"

      - name: Upload app zip
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: omairc-${{ env.OMAIRC_ARTIFACT_VERSION }}-${{ env.OMAIRC_MAC_SUFFIX }}
          path: dist/omairc-${{ env.OMAIRC_ARTIFACT_VERSION }}-${{ env.OMAIRC_MAC_SUFFIX }}.zip
          if-no-files-found: error

      - name: Notarize app zip
        if: env.APP_STORE_CONNECT_API_KEY_PATH != '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        env:
          OMAIRC_REQUIRE_NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: bin/notarize-macos

      - name: Verify notarization ticket
        if: env.OMAIRC_NOTARIZED == '1'
        run: |
          set -euo pipefail
          xcrun stapler validate "$GITHUB_WORKSPACE/build/omairc.app"

      - name: Assess Gatekeeper
        if: env.OMAIRC_NOTARIZED == '1'
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/build/omairc.app"
          bin/check-macos-syspolicy distribution "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Replace zip with stapled app
        if: env.OMAIRC_NOTARIZED == '1'
        uses: actions/upload-artifact@v7
        with:
          name: omairc-${{ env.OMAIRC_ARTIFACT_VERSION }}-${{ env.OMAIRC_MAC_SUFFIX }}
          path: dist/omairc-${{ env.OMAIRC_ARTIFACT_VERSION }}-${{ env.OMAIRC_MAC_SUFFIX }}.zip
          if-no-files-found: error
          overwrite: true

      - name: Delete rust signing keychain
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${MACOS_RUST_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_RUST_SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${APP_STORE_CONNECT_API_KEY_PATH:-}" ]; then
            rm -f "$APP_STORE_CONNECT_API_KEY_PATH"
          fi

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          zip="dist/omairc-${OMAIRC_ARTIFACT_VERSION}-${OMAIRC_MAC_SUFFIX}.zip"
          zip_name=$(basename "$zip")
          test -f "$zip"

          deadline=$(( $(date +%s) + 1800 ))
          while ! gh release view "$tag" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting for GitHub Release $tag (created by Release package)" >&2
              exit 1
            fi
            echo "Waiting for release $tag..."
            sleep 15
          done

          # Only replace this architecture's zip so a parallel Intel/ARM
          # job cannot delete the sibling release asset.
          # macOS /bin/bash is 3.2; mapfile is Bash 4+.
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          while IFS= read -r asset || [ -n "$asset" ]; do
            [ -n "$asset" ] || continue
            case "$asset" in
              omairc-[0-9]*-"$OMAIRC_MAC_SUFFIX".zip)
                if [ "$asset" != "$zip_name" ]; then
                  gh release delete-asset "$tag" "$asset" --yes
                fi
                ;;
            esac
          done <<< "$assets"

          gh release upload "$tag" "$zip" --clobber

  macos-zips:
    name: Both macOS zips
    needs: rust
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Skip zip artifacts
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Pull requests and main skip zip artifacts."
          echo "Run this workflow with workflow_dispatch to package both architecture zips."

      - name: Download architecture zips
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v8
        with:
          pattern: omairc-[0-9]*-macos-*
          merge-multiple: true
          path: dist

      - name: Assert both architecture zips
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          shopt -s nullglob
          ls -la dist || true
          arm=(dist/omairc-[0-9]*-macos-arm64.zip)
          intel=(dist/omairc-[0-9]*-macos-x64.zip)
          if [ "${#arm[@]}" -ne 1 ] || [ ! -f "${arm[0]}" ]; then
            echo "Expected one macos-arm64 zip artifact" >&2
            exit 1
          fi
          if [ "${#intel[@]}" -ne 1 ] || [ ! -f "${intel[0]}" ]; then
            echo "Expected one macos-x64 zip artifact" >&2
            exit 1
          fi
          echo "Workflow artifacts: ${arm[0]} ${intel[0]}"

          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            arm_name=$(basename "${arm[0]}")
            intel_name=$(basename "${intel[0]}")
            deadline=$(( $(date +%s) + 180 ))
            while true; do
              assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
              if printf '%s\n' "$assets" | grep -Fxq "$arm_name" && \
                 printf '%s\n' "$assets" | grep -Fxq "$intel_name"; then
                echo "Release $tag has $arm_name and $intel_name"
                break
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "Release $tag is missing a macOS zip:" >&2
                printf '%s\n' "$assets" >&2
                exit 1
              fi
              echo "Waiting for both macOS zips on release $tag..."
              sleep 10
            done
          fi

  bump-cask:
    name: Homebrew cask
    needs: macos-zips
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download architecture zips
        uses: actions/download-artifact@v8
        with:
          pattern: omairc-[0-9]*-macos-*
          merge-multiple: true
          path: dist

      - name: Point the cask at this tag
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          arm=(dist/omairc-[0-9]*-macos-arm64.zip)
          intel=(dist/omairc-[0-9]*-macos-x64.zip)
          if [ "${#arm[@]}" -ne 1 ] || [ ! -f "${arm[0]}" ]; then
            echo "Expected one macos-arm64 zip artifact" >&2
            exit 1
          fi
          if [ "${#intel[@]}" -ne 1 ] || [ ! -f "${intel[0]}" ]; then
            echo "Expected one macos-x64 zip artifact" >&2
            exit 1
          fi

          commit_cask_bump() {
            python3 bin/bump-homebrew-cask \
              --version "$tag" \
              --arm-zip "${arm[0]}" \
              --intel-zip "${intel[0]}"
            git add Casks/omairc.rb
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m "Point the Homebrew cask at the v${tag} macOS zips."
            return 0
          }

          if ! commit_cask_bump; then
            echo "Casks/omairc.rb already matches $tag"
            exit 0
          fi

          attempt=1
          max_attempts=5
          while [ "$attempt" -le "$max_attempts" ]; do
            if push_out=$(git push origin HEAD:main 2>&1); then
              printf '%s\n' "$push_out"
              echo "Pushed cask bump for v$tag"
              exit 0
            fi
            printf '%s\n' "$push_out"
            case "$push_out" in
              *non-fast-forward*|*rejected*) ;;
              *)
                echo "git push failed for a reason other than a main race" >&2
                exit 1
                ;;
            esac
            echo "Push was not a fast-forward; fetch and rebase (attempt $attempt/$max_attempts)"
            git fetch origin main
            if git rebase origin/main; then
              attempt=$((attempt + 1))
              continue
            fi
            echo "Rebase conflict; re-apply the generated bump on origin/main"
            git rebase --abort
            git reset --hard origin/main
            if ! commit_cask_bump; then
              echo "Casks/omairc.rb already matches $tag on origin/main"
              exit 0
            fi
            attempt=$((attempt + 1))
          done

          echo "Could not push the Homebrew cask bump after $max_attempts attempts" >&2
          exit 1
