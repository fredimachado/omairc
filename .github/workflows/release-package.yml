name: Release package

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release-package.yml'
      - 'PKGBUILD'
      - 'bin/version'
      - 'bin/derive-build-versions.py'
      - 'bin/gen-omaircversion-h.py'
      - 'omairc.pro'
      - 'qtkeychain.pri'
      - 'version.pri'
      - 'src/**'
      - 'fonts/**'
      - 'data/**'
      - 'LICENSE'
      - 'install.sh'
  workflow_dispatch:

concurrency:
  group: release-package
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Bootstrap pacman
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git github-cli sudo

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Derive versions
        run: |
          set -euo pipefail
          python3 bin/derive-build-versions.py \
            --git-ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --format github-env \
            --github-env "$GITHUB_ENV"
          echo "release=$OMAIRC_VERSION display=$OMAIRC_DISPLAY_VERSION artifact=$OMAIRC_ARTIFACT_VERSION pkgrel=$OMAIRC_ARCH_PKGREL"

      - name: Assert versions
        run: |
          set -euo pipefail
          VER=$(./bin/version)
          PKG=$(bash -c 'source ./PKGBUILD && printf %s "$pkgver"')
          test "$PKG" = "$VER"
          test "$VER" = "$OMAIRC_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            test "$TAG" = "$VER"
            test "$OMAIRC_DISPLAY_VERSION" = "$VER"
            test "$OMAIRC_ARTIFACT_VERSION" = "$VER"
            test "$OMAIRC_ARCH_PKGREL" = "1"
          fi

      - name: Prepare dry-build source
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          pkgver=$(./bin/version)
          tar --exclude='.git' --exclude='.arena-omairc-pacman' \
            -czf "omairc-${pkgver}.tar.gz" \
            --transform "s,^\.,omairc-${pkgver}," .
          sed -i "s|^source=.*|source=(\"omairc-${pkgver}.tar.gz\")|" PKGBUILD
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            sed -i "s/^pkgrel=.*/pkgrel=${OMAIRC_ARCH_PKGREL}/" PKGBUILD
          fi
          chown builder:builder "omairc-${pkgver}.tar.gz" PKGBUILD version.pri

      - name: makepkg
        run: |
          set -euo pipefail
          sudo -u builder env OMAIRC_BUILD_VERSION="$OMAIRC_BUILD_VERSION" makepkg -s --noconfirm

      - name: Verify package metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(omairc-[0-9]*-x86_64.pkg.tar.zst)
          test "${#pkgs[@]}" -eq 1
          PKG="${pkgs[0]}"
          PKG_BASE=$(basename "$PKG")
          meta=$(pacman -Qp "$PKG")
          test "$meta" = "omairc $OMAIRC_VERSION-$OMAIRC_ARCH_PKGREL"
          tmp=$(mktemp -d)
          tar -xf "$PKG" -C "$tmp" usr/bin/omairc
          got=$("$tmp/usr/bin/omairc" --version)
          rm -rf "$tmp"
          want="omairc $OMAIRC_DISPLAY_VERSION"
          test "$got" = "$want"
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            case "$PKG_BASE" in
              omairc-${OMAIRC_VERSION}-${OMAIRC_ARCH_PKGREL}-x86_64.pkg.tar.zst) ;;
              *)
                echo "Expected omairc-${OMAIRC_VERSION}-${OMAIRC_ARCH_PKGREL}-x86_64.pkg.tar.zst, got $PKG_BASE" >&2
                exit 1
                ;;
            esac
          fi

      - name: Build ReleaseAssetSet
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(omairc-[0-9]*-x86_64.pkg.tar.zst)
          test "${#pkgs[@]}" -eq 1
          sudo -u builder repo-add omairc.db.tar.zst "${pkgs[0]}"
          rm -f omairc.db omairc.files
          cp omairc.db.tar.zst omairc.db
          cp omairc.files.tar.zst omairc.files

      - name: Upload master snapshot package
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: omairc-${{ env.OMAIRC_ARTIFACT_VERSION }}-x86_64
          path: |
            omairc-*-x86_64.pkg.tar.zst
            omairc.db
            omairc.db.tar.zst
            omairc.files
            omairc.files.tar.zst
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG="$GITHUB_REF_NAME"
          shopt -s nullglob
          pkgs=(omairc-[0-9]*-x86_64.pkg.tar.zst)
          test "${#pkgs[@]}" -eq 1
          PKG="${pkgs[0]}"
          PKG_BASE=$(basename "$PKG")

          VER="${TAG#v}"
          case "$VER" in
            *alpha*|*beta*|*rc*|*pre*) PRE_ARGS=(--prerelease) ;;
            *) PRE_ARGS=(--latest) ;;
          esac

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "$TAG" "${PRE_ARGS[@]}"
          else
            gh release edit "$TAG" "${PRE_ARGS[@]}"
          fi

          mapfile -t assets < <(gh release view "$TAG" --json assets --jq '.assets[].name' || true)
          for asset in "${assets[@]}"; do
            if [[ "$asset" == omairc-*-x86_64.pkg.tar.zst && "$asset" != "$PKG_BASE" ]]; then
              gh release delete-asset "$TAG" "$asset" --yes
            fi
          done

          gh release upload "$TAG" \
            "$PKG" \
            omairc.db \
            omairc.db.tar.zst \
            omairc.files \
            omairc.files.tar.zst \
            install.sh \
            --clobber
