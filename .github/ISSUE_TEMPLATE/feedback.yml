name: General feedback
description: Praise, confusion, docs gaps, or anything that isn't a bug or feature request.
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for anything that doesn't fit a bug or feature template.
        Live conversation is fine too: [#omarchy](https://webchat.freenode.net/) and [#omairc](https://webchat.freenode.net/) on Freenode.
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Whatever you want us to know.
    validations:
      required: true
