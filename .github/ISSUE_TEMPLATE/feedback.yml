name: General feedback
description: Praise, confusion, docs gaps, or anything that isn't a bug or feature request.
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for anything that doesn't fit a bug or feature template.
        Live conversation is fine too: [#omarchy](https://web.libera.chat/#omarchy) and [#omairc](https://web.libera.chat/#omairc) on Libera.
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Whatever you want us to know.
    validations:
      required: true
