[package]
name = "omairc-poc-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
# The avatar decode: header dimensions, then the first frame as PNG. gpui already
# links this exact release (0.25.10) with its default formats, so no new code is
# compiled; the pin keeps the decode the one the budget was written against.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = "0.4"
notify = "8.0"
nucleo-matcher = "=0.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1_smol = "=1.0.1"
# SCRAM-SHA-256 (`src/session/saslscram.rs`). hmac and pbkdf2 are already in Cargo.lock,
# through oo7 on Linux, so nothing is fetched for them; a Windows or macOS build compiles
# these two small RustCrypto crates once. base64 0.22.1 is the release usvg and gpui
# already build on every target, so nothing new compiles for it.
hmac = "=0.12.1"
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
base64 = "=0.22.1"
# The SCRAM client nonce is 16 OS random bytes. getrandom 0.3.4 is the backend rand 0.9,
# which gpui builds, so nothing new compiles for it.
getrandom = "=0.3.4"
unicode-segmentation = "1.12"
ureq = "=3.4.2"
url = "2.5"
mime_guess = "=2.0.5"
# The net layer (src/net/ only). gpui already builds these exact releases through its
# reqwest client, so nothing new compiles. Cancellation is JoinHandle::abort, so the
# tokio macros feature stays off. If a gpui upgrade drops reqwest, these become real
# compiles; nothing else changes.
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "net", "io-util", "time", "sync"] }
# gpui already builds this ring-backed rustls and tokio-rustls pair.
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The OS trust store first; webpki-roots is the fallback when that store is empty.
# gpui builds rustls-native-certs, and ureq already builds webpki-roots.
rustls-native-certs = "=0.8.5"
webpki-roots = "=1.0.10"
# gpui already builds this release (through async-global-executor), so nothing new compiles.
async-channel = "=2.5.0"
# TCP keepalive needs the socket itself; tokio's net feature already builds this release.
socket2 = "=0.6.5"

# The installed-copy probe reads the Inno uninstall key from the registry.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "=0.61.3", features = [
    "UI_Notifications",
    "Data_Xml_Dom",
    "Win32_UI_Notifications",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Storage_EnhancedStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "=0.61.2"
windows-implement = "=0.60.2"
# The product CLI's named pipe: std has no pipe server, so the few kernel32 calls come from here.
# Pinned to the 0.61.2 that winreg already builds on Windows, so no new crate is fetched.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

# The macOS login keychain: generic passwords, through the Security framework the lock already holds.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSBundle",
    "NSObject",
    "NSString",
] }
# The macOS notification centre. objc2-user-notifications pulls in objc2-core-location, and
# both are the objc2 0.3.2 framework bindings matching the objc2-foundation 0.3.2 above, which
# gpui already builds. The pin is exact. Together they are the only packages the notification
# bindings add to Cargo.lock; objc2-core-location is transitive and not listed here.
objc2-user-notifications = "=0.3.2"
block2 = "=0.6.2"

# The Secret Service on Linux. `futures` only supplies `block_on`, which drives oo7 on the calling thread.
[target.'cfg(target_os = "linux")'.dependencies]
futures = { version = "=0.3.34", default-features = false, features = ["executor"] }
# gpui enables oo7's async-std feature, and ashpd refuses tokio next to async-std, so oo7 keeps tokio off.
oo7 = { version = "=0.5.0", default-features = false, features = ["native_crypto"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }

# Windows build script only: compiles the icon and version resource that build.rs
# embeds. The pin is the copy gpui already builds with, so no new crate is added.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"

# Test-only: the architecture gates in tests/ match source text with it.
[dev-dependencies]
regex = "=1.13.1"

# xattr 0.2.3 reads libc::ENOATTR on Linux, which current libc no longer
# exports there. The vendored copy maps it to ENODATA on Linux only; the
# other targets keep libc::ENOATTR, and Windows never builds xattr.
#
# gpui 0.2.2 -> stacksafe 0.1.4 -> stacksafe-macro 0.1.4 pins proc-macro-error2
# "2", and 2.0.1 is still the newest release. Its `pub use proc_macro;` trips
# rustc's future-incompatible E0365 (a hard error in a future Rust). Upstream
# master is unchanged since 2024-09, so point at a vendored copy of 2.0.1 with
# one line changed (`pub extern crate proc_macro;`). See the comment in
# vendor/proc-macro-error2/src/lib.rs. Drop this when a fixed release ships.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
