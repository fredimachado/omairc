[package]
name = "omairc-poc-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
notify = "8.0"
nucleo-matcher = "=0.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
ureq = "=3.4.2"

# xattr 0.2.3 reads libc::ENOATTR on Linux, which current libc no longer
# exports there. The vendored copy maps it to ENODATA on Linux only; the
# other targets keep libc::ENOATTR, and Windows never builds xattr.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
