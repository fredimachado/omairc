loadmodule "extensions/tag_typing";

serverinfo {
	name = "solanum.test";
	sid = "42X";
	description = "Omairc live Solanum";
	network_name = "OmaircLive";
	ssl_cert = "etc/ssl.pem";
	ssl_private_key = "etc/ssl.key";
	ssld_count = 1;
	default_max_clients = 128;
	nicklen = 16;
};

admin {
	name = "Omairc";
	description = "live tests";
	email = "live@solanum.test";
};

log {
	fname_userlog = "logs/userlog";
	fname_operlog = "logs/operlog";
	fname_serverlog = "logs/serverlog";
	fname_killlog = "logs/killlog";
	fname_operspylog = "logs/operspylog";
};

class "users" {
	ping_time = 2 minutes;
	number_per_ident = 100;
	number_per_ip = 100;
	number_per_ip_global = 100;
	cidr_ipv4_bitlen = 24;
	cidr_ipv6_bitlen = 64;
	number_per_cidr = 100;
	max_number = 128;
	sendq = 400 kbytes;
};

listen {
	defer_accept = no;
	host = "0.0.0.0";
	port = 6667;
	sslport = 6697;
};

auth {
	user = "*@*";
	class = "users";
	spoof = "solanum.test";
	flags = kline_exempt, dnsbl_exempt, flood_exempt, no_tilde;
};

channel {
	use_invex = yes;
	use_except = yes;
	use_forward = no;
	use_knock = yes;
	max_chans_per_user = 15;
	max_bans = 100;
	default_split_user_count = 0;
	default_split_server_count = 0;
	no_create_on_split = no;
	no_join_on_split = no;
	burst_topicwho = yes;
	autochanmodes = "+nt";
};

serverhide {
	flatten_links = yes;
	links_delay = 5 minutes;
	hidden = no;
	disable_hidden = no;
};

general {
	hide_error_messages = opers;
	hide_spoof_ips = yes;
	default_umodes = "+i";
	disable_fake_channels = no;
	default_floodcount = 100;
	anti_nick_flood = no;
	anti_spam_exit_message_time = 0 seconds;
	connect_timeout = 30 seconds;
	default_ident_timeout = 1;
	disable_auth = yes;
	ping_cookie = no;
	post_registration_delay = 0 seconds;
	throttle_duration = 1;
	throttle_count = 50;
	max_ratelimit_tokens = 30;
	away_interval = 0;
	client_flood_max_lines = 100;
};

modules {
	path = "modules";
	path = "modules/autoload";
};
