[Global]
	Name = ngircd.test
	Info = Omairc live ngIRCd
	Listen = 0.0.0.0
	Ports = 6667
	PidFile = /tmp/ngircd.pid
	ServerUID = ngircd
	ServerGID = ngircd
	AdminInfo1 = Omairc
	AdminInfo2 = live tests
	AdminEMail = live@ngircd.test

[Limits]
	MaxNickLength = 9
	MaxConnectionsIP = 100
	MaxJoins = 20

[Options]
	Ident = no
	DNS = no
	PAM = no
	MorePrivacy = yes
	NoticeBeforeRegistration = yes
	CloakHost = ngircd.test
